name: Check Upstream Updates

on:
  schedule:
    - cron: '0 23 * * 0'  # 매주 월요일 08:00 KST (일요일 23:00 UTC)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/affaan-m/everything-claude-code.git || true
          git fetch upstream main

      - name: Get new commits from upstream
        id: diff
        run: |
          LAST_CHECK=$(git log -1 --format=%H origin/main)
          NEW_COMMITS=$(git log --oneline ${LAST_CHECK}..upstream/main -- rules/ contexts/ hooks.json agents/ CLAUDE.md examples/ 2>/dev/null | head -30)

          if [ -z "$NEW_COMMITS" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No new updates found."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            {
              echo "commits<<EOF"
              echo "$NEW_COMMITS"
              echo "EOF"
            } >> $GITHUB_OUTPUT

            # Get changed files summary
            CHANGED_FILES=$(git diff --stat ${LAST_CHECK}..upstream/main -- rules/ contexts/ hooks.json agents/ CLAUDE.md examples/ 2>/dev/null | tail -20)
            {
              echo "files<<EOF"
              echo "$CHANGED_FILES"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Create issue for updates
        if: steps.diff.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const commits = `${{ steps.diff.outputs.commits }}`;
            const files = `${{ steps.diff.outputs.files }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Upstream] everything-claude-code updates (${today})`,
              body: `## Upstream Changes Detected\n\n### New Commits\n\`\`\`\n${commits}\n\`\`\`\n\n### Changed Files\n\`\`\`\n${files}\n\`\`\`\n\n### Action Required\n- [ ] Review changes\n- [ ] Apply relevant updates to entertainment-da-airflow project\n- [ ] Sync fork: \`gh repo sync SeoulLYJ96/everything-claude-code\``,
              labels: ['upstream-update']
            });
